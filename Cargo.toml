# Atlas Desktop · Cargo workspace root.
#
# All Rust crates live under `crates/`. The Tauri shell consumes them.
# atlas-server (Laravel) remains the canonical Kernel — no orchestration,
# provider routing, memory or canon authority lives in this workspace.

[workspace]
resolver = "2"
members = [
  "crates/atlas-tauri",
  "crates/atlas-platform",
  "crates/atlas-bridge",
  "crates/atlas-receipts",
  "crates/atlas-canon",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Proprietary"
repository = "https://github.com/vitorepf/atlas-desktop"
authors = ["Vitor <vitordsny@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Profiles tuned for desktop binary size + dev iteration.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
debug = true
