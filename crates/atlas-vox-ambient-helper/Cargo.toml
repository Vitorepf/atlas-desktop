[package]
name = "atlas-vox-ambient-helper"
description = "Atlas Vox · ambient hotkey helper (V6-B). Captura Option+Space quando Atlas Code está fechado e dispara `open -a` com o sinal canônico `--vox-start-listening`. NUNCA grava áudio, NUNCA chama Kernel/provider."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "atlas-vox-ambient-helper"
path = "src/main.rs"

[dependencies]
# Reusa o runtime de hotkey canônico — qualquer mudança de comportamento
# segue para o helper sem fork.
atlas-platform = { path = "../atlas-platform" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = "0.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
