[package]
name = "atlas-platform"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time"] }
tracing = "0.1"
thiserror = "2"
portable-pty = "0.8"
notify = "6"
anyhow = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
