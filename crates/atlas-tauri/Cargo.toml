[package]
name = "atlas-tauri"
description = "Tauri shell · the operational cabin around the Kernel."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "atlas_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }

# Workspace siblings · the Tauri shell composes the native crates.
atlas-bridge = { path = "../atlas-bridge" }
atlas-platform = { path = "../atlas-platform" }
atlas-receipts = { path = "../atlas-receipts" }
atlas-canon = { path = "../atlas-canon" }
